<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-5">
    <h1>Contato</h1>
    <form>
      <input class="form-control mb-3" type="text" placeholder="Seu nome">
      <input class="form-control mb-3" type="email" placeholder="Seu e-mail">
      <textarea class="form-control mb-3" placeholder="Mensagem"></textarea>
      <button class="btn btn-warning" type="button">Enviar</button>
    </form>
    <a href="index.html" class="btn btn-dark mt-3">Voltar</a>
  </main>
</body>
</html>
