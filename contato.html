<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>

  <style>
    body{
      background: linear-gradient(to right, #111, #1d1d1d);
      color: white;
      font-family: Arial, sans-serif;
    }

    .banner{
      background: url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=1200&auto=format&fit=crop') center/cover;
      height: 320px;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .banner h1{
      background-color: rgba(0,0,0,0.6);
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 3rem;
    }

    .form-area{
      background-color: #222;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .form-control{
      background-color: #333;
      border: none;
      color: white;
    }

    .form-control::placeholder{
      color: #bbb;
    }

    .form-control:focus{
      background-color: #444;
      color: white;
      box-shadow: 0 0 10px rgba(255,193,7,0.5);
    }

    .btn-warning{
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-warning:hover{
      transform: scale(1.05);
    }

    footer{
      margin-top: 50px;
      text-align: center;
      padding: 20px;
      color: #bbb;
      border-top: 1px solid #444;
    }
  </style>
</head>

<body>

  <main class="container my-5">

    <!-- Banner -->
    <section class="banner">
      <h1>📩 Contato</h1>
    </section>

    <!-- Texto -->
    <section class="mb-4 text-center">
      <h2>Entre em contato</h2>

      <p>
        Tem dúvidas, sugestões ou quer falar sobre jazz?
        Envie sua mensagem pelo formulário abaixo.
      </p>
    </section>

    <!-- Formulário -->
    <section class="form-area">

      <form>

        <div class="mb-4">
          <label class="form-label">Seu nome</label>

          <input 
            class="form-control p-3" 
            type="text" 
            placeholder="Digite seu nome"
          >
        </div>

        <div class="mb-4">
          <label class="form-label">Seu e-mail</label>

          <input 
            class="form-control p-3" 
            type="email" 
            placeholder="Digite seu e-mail"
          >
        </div>

        <div class="mb-4">
          <label class="form-label">Mensagem</label>

          <textarea 
            class="form-control p-3" 
            rows="5"
            placeholder="Digite sua mensagem">
          </textarea>
        </div>

        <button class="btn btn-warning btn-lg w-100" type="button">
          ✉ Enviar mensagem
        </button>

      </form>

    </section>

    <!-- Botão voltar -->
    <div class="mt-4">
      <a href="index.html" class="btn btn-outline-light btn-lg">
        ⬅ Voltar
      </a>
    </div>

  </main>

  <!-- Rodapé -->
  <footer>
    <p>Projeto Jazz Influência AB 🎷</p>
  </footer>

</body>
</html>
